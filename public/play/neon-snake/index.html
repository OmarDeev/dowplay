<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<title>Neon Snake</title>
<style>
  html, body { margin: 0; height: 100%; background: #07080f; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  body { display: grid; place-items: center; font-family: system-ui, -apple-system, sans-serif; color: #eef0fb; }
  canvas { display: block; }
  #hud { position: fixed; top: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 24px; font-weight: 700; font-size: 15px; letter-spacing: .05em; pointer-events: none; }
  #hud span { opacity: .85; }
  #screen { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: 8px; background: rgba(7,8,15,.72); cursor: pointer; }
  #screen h1 { margin: 0; font-size: clamp(32px, 8vw, 64px); color: #c8ff3d; text-shadow: 0 0 24px rgba(200,255,61,.6); letter-spacing: -.02em; }
  #screen p { margin: 0; color: #9ba2c4; font-size: 16px; }
  #screen .big { color: #eef0fb; font-size: 20px; font-weight: 700; margin-top: 8px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span>SCORE <b id="score">0</b></span><span>BEST <b id="best">0</b></span></div>
<div id="screen">
  <h1 id="headline">NEON SNAKE</h1>
  <p id="sub">Eat the glowing orbs. Don't bite yourself.</p>
  <p class="big" id="action">Tap or press Space to start</p>
  <p>Arrows / WASD or swipe to steer</p>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const screen = document.getElementById('screen');
  const headline = document.getElementById('headline');
  const sub = document.getElementById('sub');
  const action = document.getElementById('action');

  const BEST_KEY = 'neon-snake-best';
  let best = 0;
  try { best = Number(localStorage.getItem(BEST_KEY)) || 0; } catch {}
  bestEl.textContent = best;

  let cols, rows, cell, snake, dir, queue, food, score, running, stepMs, acc, last;

  function layout(regrid = true) {
    if (regrid) {
      const portrait = innerHeight > innerWidth;
      cols = portrait ? 14 : 24;
      rows = portrait ? 24 : 14;
    }
    const pad = 44;
    cell = Math.max(8, Math.floor(Math.min((innerWidth - 16) / cols, (innerHeight - pad - 8) / rows)));
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = cols * cell * dpr;
    canvas.height = rows * cell * dpr;
    canvas.style.width = cols * cell + 'px';
    canvas.style.height = rows * cell + 'px';
    canvas.style.marginTop = pad / 2 + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function reset() {
    layout();
    const cx = Math.floor(cols / 2), cy = Math.floor(rows / 2);
    snake = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }];
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0;
    stepMs = 120;
    acc = 0;
    scoreEl.textContent = 0;
    placeFood();
  }

  function placeFood() {
    do {
      food = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function turn(x, y) {
    const lastDir = queue.length ? queue[queue.length - 1] : dir;
    if (lastDir.x === -x && lastDir.y === -y) return;
    if (lastDir.x === x && lastDir.y === y) return;
    if (queue.length < 3) queue.push({ x, y });
  }

  function step() {
    if (queue.length) dir = queue.shift();
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= cols || head.y >= rows ||
        snake.some((s, i) => i < snake.length - 1 && s.x === head.x && s.y === head.y)) {
      return gameOver();
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      stepMs = Math.max(60, 120 - score * 2);
      placeFood();
    } else {
      snake.pop();
    }
  }

  function draw(t) {
    ctx.fillStyle = '#0b0d17';
    ctx.fillRect(0, 0, cols * cell, rows * cell);
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    for (let x = 1; x < cols; x++) { ctx.beginPath(); ctx.moveTo(x * cell + .5, 0); ctx.lineTo(x * cell + .5, rows * cell); ctx.stroke(); }
    for (let y = 1; y < rows; y++) { ctx.beginPath(); ctx.moveTo(0, y * cell + .5); ctx.lineTo(cols * cell, y * cell + .5); ctx.stroke(); }

    const pulse = 0.75 + Math.sin(t / 180) * 0.25;
    ctx.shadowColor = '#ff4fd8';
    ctx.shadowBlur = 18 * pulse;
    ctx.fillStyle = '#ff4fd8';
    ctx.beginPath();
    ctx.arc(food.x * cell + cell / 2, food.y * cell + cell / 2, cell * 0.32, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowColor = '#c8ff3d';
    ctx.shadowBlur = 14;
    snake.forEach((s, i) => {
      const k = 1 - (i / snake.length) * 0.55;
      ctx.fillStyle = i === 0 ? '#e4ff94' : `rgba(200,255,61,${k})`;
      const inset = i === 0 ? cell * 0.08 : cell * 0.14;
      roundRect(s.x * cell + inset, s.y * cell + inset, cell - inset * 2, cell - inset * 2, cell * 0.25);
    });
    ctx.shadowBlur = 0;

    ctx.strokeStyle = 'rgba(200,255,61,0.35)';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, cols * cell - 2, rows * cell - 2);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.fill();
  }

  function loop(t) {
    if (last == null) last = t;
    acc += t - last;
    last = t;
    if (running) {
      while (acc >= stepMs && running) { acc -= stepMs; step(); }
    } else {
      acc = 0;
    }
    draw(t);
    requestAnimationFrame(loop);
  }

  function start() {
    reset();
    running = true;
    screen.hidden = true;
  }

  function gameOver() {
    running = false;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem(BEST_KEY, best); } catch {}
    }
    headline.textContent = 'GAME OVER';
    sub.textContent = `You scored ${score}` + (score && score === best ? ' — new best!' : '');
    action.textContent = 'Tap or press Space to play again';
    screen.hidden = false;
  }

  const KEYS = {
    ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1],
    ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0],
  };
  addEventListener('keydown', e => {
    if (KEYS[e.code]) {
      e.preventDefault();
      if (!running) return start();
      turn(...KEYS[e.code]);
    } else if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (!running) start();
    }
  });

  let touch = null;
  addEventListener('pointerdown', e => {
    touch = { x: e.clientX, y: e.clientY };
    if (!running) start();
  });
  addEventListener('pointermove', e => {
    if (!touch || !running) return;
    const dx = e.clientX - touch.x, dy = e.clientY - touch.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0); else turn(0, Math.sign(dy));
    touch = { x: e.clientX, y: e.clientY };
  });
  addEventListener('pointerup', () => (touch = null));
  addEventListener('resize', () => { if (!running) reset(); else layout(false); });
  document.addEventListener('visibilitychange', () => { last = null; });

  reset();
  running = false;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
